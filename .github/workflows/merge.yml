name: "Release Manager/Go Merge"

on:
  workflow_call:
    inputs:
      pr_number:
        type: string
        description: PR number
        required: true
      user:
        type: string
        description: User name
        default: github-actions[bot]
      package_jsons_to_rewrite:
        type: string
        description: 'package.jsons to rewrite (json)'
        default: 'package.json'
      changes_template:
        type: string
        description: 'Template for CHANGELOG.md'
        default: |
          ## Unreleased
          -
      use_external_app_to_release:
        type: boolean
        default: false
      indent:
        type: string
        description: '`tab` or number of spaces'
        default: tab
    secrets:
      RELEASE_APP_ID:
        description: 'App ID for app to create release'
      RELEASE_APP_PRIVATE_KEY:
        description: 'Private key for app to create release'

permissions:
  contents: write
  issues: write
  pull-requests: write

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  merge:
    name: "Go Merge"
    runs-on: ubuntu-latest
    if: ${{ inputs.pr_number != '' }}
    steps:
      - uses: actions/checkout@v4
      - name: Initialize
        uses: misskey-dev/release-manager-actions/.github/actions/checkout-pr@v2
        with:
          pr_number: ${{ inputs.pr_number }}
          user: ${{ inputs.user }}
      - name: Get target version
        uses: misskey-dev/release-manager-actions/.github/actions/get-target-version@v2
        id: v

      - uses: actions/create-github-app-token@v1
        id: release-app-token
        if: inputs.use_external_app_to_release
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      # mergeable: UNKNOWNを回避したい
      - name: 'Pre-fetch PR data'
        run: |
          gh pr view "$PR_NUMBER" --json mergeable
        env:
          PR_NUMBER: ${{ inputs.pr_number }}
          GITHUB_TOKEN: ${{ inputs.use_external_app_to_release && steps.release-app-token.outputs.token || secrets.GITHUB_TOKEN }}
      - name: Sleep
        run: sleep 5s

      - name: 'Fetch PR data'
        id: pr-data
        run: |
          echo "data=$(gh pr view "$PR_NUMBER" --json baseRefName,reviewDecision,isDraft,mergeStateStatus,mergeable)" >> $GITHUB_OUTPUT
          # gh pr view の statusCheckRollup にはワークフローを一意に識別する情報が無いので、GraphQL で直接取得する
          checks=$(gh api graphql \
            -F owner="${GITHUB_REPOSITORY%/*}" -F repo="${GITHUB_REPOSITORY#*/}" -F number="$PR_NUMBER" \
            -f query='
              query($owner: String!, $repo: String!, $number: Int!) {
                repository(owner: $owner, name: $repo) {
                  pullRequest(number: $number) {
                    commits(last: 1) { nodes { commit { statusCheckRollup { contexts(first: 100) {
                      pageInfo { hasNextPage }
                      nodes {
                        __typename
                        ... on CheckRun {
                          name status conclusion startedAt
                          checkSuite { workflowRun { workflow { databaseId name } } }
                        }
                        ... on StatusContext { context state createdAt }
                      }
                    } } } } }
                  }
                }
              }' \
            --jq '.data.repository.pullRequest.commits.nodes[0].commit.statusCheckRollup.contexts // {"pageInfo":{"hasNextPage":false},"nodes":[]}' | jq -c .)
          echo "checks=$checks" >> $GITHUB_OUTPUT
        env:
          PR_NUMBER: ${{ inputs.pr_number }}
          GITHUB_TOKEN: ${{ inputs.use_external_app_to_release && steps.release-app-token.outputs.token || secrets.GITHUB_TOKEN }}
      - name: 'Check Mergeable: compare'
        uses: actions/script@v7
        env:
          pr_data: ${{ steps.pr-data.outputs.data }}
          pr_checks: ${{ steps.pr-data.outputs.checks }}
        with:
          script: |
            const pr = JSON.parse(process.env.pr_data);
            if (pr.isDraft) {
              throw new Error('PR is draft');
            }
            if (pr.reviewDecision !== 'APPROVED') {
              throw new Error(`reviewDecision is not APPROVED (${pr.reviewDecision}). You must approve the PR before merging.`);
            }
            if (pr.mergeable !== 'MERGEABLE') {
              throw new Error(`Not mergeable: ${pr.mergeable}`);
            }
            // BLOCKED: --admin でマージするので、ブランチ保護による BLOCKED は許容する
            // HAS_HOOKS: pre-receive hook があるだけでマージ可能
            const allowedMergeStateStatuses = ['CLEAN', 'BLOCKED', 'HAS_HOOKS'];
            if (!allowedMergeStateStatuses.includes(pr.mergeStateStatus)) {
              throw new Error(`MergeStateStatus is not mergeable: ${pr.mergeStateStatus}`);
            }

            // statusCheckRollup は CheckRun と StatusContext の union
            // https://docs.github.com/en/graphql/reference/unions#statuscheckrollupcontext
            // - CheckRun: status (QUEUED, IN_PROGRESS, COMPLETED, WAITING, PENDING, REQUESTED)
            //             conclusion (SUCCESS, NEUTRAL, SKIPPED, FAILURE, CANCELLED, TIMED_OUT, ACTION_REQUIRED, STARTUP_FAILURE, STALE)
            // - StatusContext: state (SUCCESS, PENDING, EXPECTED, ERROR, FAILURE)
            const rollup = JSON.parse(process.env.pr_checks);
            if (rollup.pageInfo.hasNextPage) {
              throw new Error('Too many status checks (> 100) to verify');
            }
            const checks = rollup.nodes;

            const workflow = (c) => c.checkSuite?.workflowRun?.workflow;
            const checkName = (c) => c.__typename === 'StatusContext'
              ? c.context
              : [workflow(c)?.name, c.name].filter(Boolean).join(' / ');
            // 同一チェックとみなすキー。CheckRun はワークフロー ID (表示名ではなく databaseId) + ジョブ名で識別する。
            // ワークフロー ID が取れない (Actions 以外のチェック等で再実行かどうか判断できない) ものは null を返し、重複排除しない
            const dedupeKey = (c) => {
              if (c.__typename === 'StatusContext') return `StatusContext:${c.context}`;
              const workflowId = workflow(c)?.databaseId;
              return workflowId != null ? `CheckRun:${workflowId}:${c.name}` : null;
            };
            // 未開始のものは startedAt が null になるが、既存のものより新しいとみなす
            const startedAt = (c) => {
              const t = Date.parse(c.__typename === 'StatusContext' ? c.createdAt : c.startedAt);
              return Number.isNaN(t) ? Infinity : t;
            };

            // 同じチェックの再実行や、同じコミットに対する複数回の実行は最新のものだけを評価する
            const latest = new Map();
            const unkeyed = [];
            for (const c of checks) {
              const key = dedupeKey(c);
              if (key == null) {
                unkeyed.push(c);
                continue;
              }
              const prev = latest.get(key);
              if (!prev || startedAt(c) >= startedAt(prev)) latest.set(key, c);
            }
            const targets = [...latest.values(), ...unkeyed];

            const pending = [];
            const failed = [];
            for (const c of targets) {
              if (c.__typename === 'StatusContext') {
                if (c.state === 'SUCCESS') continue;
                if (c.state === 'PENDING' || c.state === 'EXPECTED') pending.push(c);
                else failed.push(c);
              } else {
                if (c.status !== 'COMPLETED') pending.push(c);
                else if (['SUCCESS', 'NEUTRAL', 'SKIPPED'].includes(c.conclusion)) continue;
                else failed.push(c);
              }
            }

            const describe = (c) => `- ${checkName(c)}: ${c.__typename === 'StatusContext' ? c.state : (c.status === 'COMPLETED' ? c.conclusion : c.status)}`;
            if (failed.length > 0 || pending.length > 0) {
              const lines = [];
              if (failed.length > 0) lines.push('Failed status checks:', ...failed.map(describe));
              if (pending.length > 0) lines.push('Pending status checks:', ...pending.map(describe));
              core.error(lines.join('\n'));
              throw new Error(`Not all status checks are passed (failed: ${failed.length}, pending: ${pending.length})`);
            }
            core.info(`All ${targets.length} status checks are passed`);

      # バージョンをpackage.jsonに書き込み
      - name: Write version
        uses: misskey-dev/release-manager-actions/.github/actions/rewrite-package-json@v2
        with:
          version: ${{ steps.v.outputs.target_version }}
          package_jsons: ${{ inputs.package_jsons_to_rewrite }}
          indent: ${{ inputs.indent }}
      # commit, push
      - name: Commit version
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git commit -am "Release: $TARGET_VERSION"
            git push
          fi
        env:
          TARGET_VERSION: ${{ steps.v.outputs.target_version }}

      # CHANGELOG.mdの内容を取得
      - name: Get changelog
        uses: misskey-dev/release-manager-actions/.github/actions/get-changelog@v2
        with:
          version: ${{ steps.v.outputs.target_version }}
        id: changelog

      - name: Create tag
        run: |
          git tag "$TARGET_VERSION"
          git push origin "$TARGET_VERSION"
        env:
          TARGET_VERSION: ${{ steps.v.outputs.target_version }}

      # リリースを作成
      - name: Create release
        env:
          GITHUB_TOKEN: ${{ inputs.use_external_app_to_release && steps.release-app-token.outputs.token || secrets.GITHUB_TOKEN }}
          TARGET_VERSION: ${{ steps.v.outputs.target_version }}
          CHANGELOG: ${{ steps.changelog.outputs.changelog }}
        run: |
          gh release create "$TARGET_VERSION" --title "$TARGET_VERSION" --notes "$CHANGELOG"

      # Merge
      # (Retry because mergeable can unknown after push)
      - name: Merge PR
        uses: prichey/retry@c92c7ba2f5f4d0b3b7b2b04cc5c6672f9c884a3f
        with:
          command: |
            gh pr merge "$PR_NUMBER" --merge --admin
          timeout_seconds: 30
          max_attempts: 3
          retry_wait_seconds: 5
        env:
          PR_NUMBER: ${{ inputs.pr_number }}
          GITHUB_TOKEN: ${{ inputs.use_external_app_to_release && steps.release-app-token.outputs.token || secrets.GITHUB_TOKEN }}

      # CHANGELOG.mdにUnreleasedのテンプレートを追加
      - name: Prepend CHANGELOG template
        env:
          CHANGES_TEMPLATE: ${{ inputs.changes_template }}
        run: sed -i "$(sed -n '/^## /=' CHANGELOG.md | head -1)i $(echo "${CHANGES_TEMPLATE}" | sed -r 's/$/\\n/' | while IFS= read -r line; do echo -n "$line"; done)" CHANGELOG.md
      - name: Update CHANGELOG.md (prepend template)
        run: |
          git commit -am "[skip ci] Update CHANGELOG.md (prepend template)"
          git push
